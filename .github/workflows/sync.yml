name: Sync official 3x-ui and build Chinese scripts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official scripts
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/MHSanaei/3x-ui/main/install.sh \
            -o dist/upstream-install.sh
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/MHSanaei/3x-ui/main/x-ui.sh \
            -o dist/upstream-x-ui.sh
      - name: Build translated scripts
        run: python3 tools/build-cn.py
      - name: Check shell syntax
        run: bash -n dist/install-cn.sh && bash -n dist/x-ui-cn.sh
      - name: Commit generated scripts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f dist/install-cn.sh dist/x-ui-cn.sh
          git diff --cached --quiet || git commit -m "sync official 3x-ui scripts"
          git push
